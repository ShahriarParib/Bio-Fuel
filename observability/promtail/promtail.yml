# Ships the JSON logs of every container labelled logging=promtail (our services) to Loki.
# Only low-cardinality fields become labels (service, level, event); tick/decision_id stay in the line (query with | json).
server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
        filters:
          - name: label
            values: ["logging=promtail"]
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container
    pipeline_stages:
      - json:
          expressions: {service: service, level: level, event: event}
      - labels: {service: "", level: "", event: ""}
