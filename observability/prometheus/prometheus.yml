global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: engine
    metrics_path: /metrics/
    static_configs: [{targets: ["engine:8100"], labels: {service: engine}}]
  - job_name: intelligence
    metrics_path: /metrics/
    static_configs: [{targets: ["intelligence:8200"], labels: {service: intelligence}}]
  - job_name: api
    metrics_path: /metrics/
    dns_sd_configs:                  # discovers every scaled api replica
      - names: ["api"]
        type: A
        port: 8080
    relabel_configs:
      - target_label: service
        replacement: api
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
    metric_relabel_configs:          # keep only our containers' series: cAdvisor is very chatty
      - source_labels: [container_label_com_docker_compose_service]
        regex: ".+"
        action: keep
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: alertmanager
    static_configs: [{targets: ["alertmanager:9093"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
