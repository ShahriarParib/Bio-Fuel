# Single-node Kubernetes cluster for the laptop (kind = Kubernetes in Docker).
# The console and the simulator are reachable from the host through the node ports below.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fsip
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      # metrics-server (needed by the autoscaler) talks to the kubelet over TLS; in kind the node has no real cert
      - |
        kind: KubeletConfiguration
        serverTLSBootstrap: true
    extraPortMappings:
      - {containerPort: 30080, hostPort: 3080, protocol: TCP}   # operator console
      - {containerPort: 30800, hostPort: 3800, protocol: TCP}   # simulator (admin API for the demo)
