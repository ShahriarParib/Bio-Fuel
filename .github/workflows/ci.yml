name: ci
on:
  push: {branches: [main, dev, "feature/**", "fix/**", "chore/**"]}
  pull_request: {}
  workflow_dispatch: {}

concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt && pip install -e libs/fsip_common
      - run: ruff check libs services
      - run: cd libs/fsip_common && python -m pytest -q
      - run: for s in engine intelligence api; do (cd services/$s && python -m pytest -q) || exit 1; done

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build

  e2e:
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i 's/^SIMULATION_SPEED=.*/SIMULATION_SPEED=8/' .env
      - run: docker compose up -d --build
      - run: bash scripts/smoke_test.sh
      # phase 12 adds: python evaluation/harness.py --scenario baseline --ticks 96 --policy heuristic --assert-service-level 0.99
      - if: failure()
        run: docker compose ps && docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  # phase 13 adds: publish (GHCR, tags), trivy, sbom, cosign (T3)
