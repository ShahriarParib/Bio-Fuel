# Source → Build → Test → Package → Deploy-check → Health check (brief §13).
#   every push / PR : lint, unit tests, image build, e2e with the REAL simulator image, smoke, decision-quality gate,
#                     metrics contract, Trivy scan
#   tag v*          : the same, then push images to GHCR (:vX.Y.Z and :sha) and publish a GitHub Release with the
#                     evaluation and resilience reports attached
name: ci
on:
  push:
    branches: [main, dev, "feature/**", "fix/**", "chore/**"]
    tags: ["v*"]
  pull_request: {}
  workflow_dispatch: {}

concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

permissions:
  contents: read

env:
  SERVICES: "engine api intelligence frontend"

jobs:
  python:
    name: lint + unit tests (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: requirements-dev.txt}
      - run: pip install -r requirements-dev.txt && pip install -e libs/fsip_common
      - run: ruff check libs services evaluation chaos-proxy
      - run: cd libs/fsip_common && python -m pytest -q
      - run: for s in engine intelligence api; do (cd services/$s && python -m pytest -q) || exit 1; done

  frontend:
    name: typecheck + tests + build (frontend)
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run build

  chart:
    # The Kubernetes manifests are rendered and checked on every push. The invariant assertion in
    # scripts/k8s/lint.sh is the point: a change that scales the engine (the only writer to the simulator)
    # or drops a resource limit fails here instead of in a cluster.
    name: helm chart render + invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.16.3}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml==6.0.2
      - run: bash scripts/k8s/lint.sh

  e2e:
    name: e2e on the real simulator + decision-quality gate
    needs: [python, frontend, chart]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install httpx==0.27.2
      - name: build images (buildx, GitHub cache)
        uses: docker/setup-buildx-action@v3
      - run: cp .env.example .env
      - name: start the stack (official simulator image asifmahmoud414/bup-fuel-supply-simulator:1.0.0)
        run: |
          export APP_VERSION=ci-${GITHUB_SHA::7} GIT_SHA=${GITHUB_SHA::7}
          docker compose build --build-arg APP_VERSION=$APP_VERSION --build-arg GIT_SHA=$GIT_SHA
          docker compose up -d --wait --wait-timeout 180
      - name: health check (smoke)
        run: bash scripts/smoke_test.sh
      - name: decision-quality gate (baseline, 96 ticks, heuristic → SL >= 0.99, 0 failures, 0 overflow)
        run: python evaluation/harness.py --scenario baseline --policy heuristic --ticks 96 --assert-sl 0.99 --assert-no-failures
      - name: decision-quality gate (optimizer)
        run: python evaluation/harness.py --scenario baseline --policy optimizer --ticks 96 --assert-sl 0.99 --assert-no-failures
      - name: metrics contract (every metric the dashboards, alerts and SLOs need)
        run: bash scripts/check_metrics.sh
      - name: save images for the scan job
        run: |
          for s in $SERVICES; do docker image inspect fsip/$s:ci-${GITHUB_SHA::7} >/dev/null; done
          docker save $(for s in $SERVICES; do echo fsip/$s:ci-${GITHUB_SHA::7}; done) | gzip > images.tar.gz
      - uses: actions/upload-artifact@v4
        with: {name: images, path: images.tar.gz, retention-days: 3}
      - if: failure()
        run: docker compose ps && docker compose logs --tail=200
      - if: always()
        run: docker compose down -v

  scan:
    name: Trivy (fail on fixable CRITICAL)
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {name: images}
      - run: gunzip -c images.tar.gz | docker load
      - name: scan every image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 --version
          fail=0
          for s in $SERVICES; do
            img=fsip/$s:ci-${GITHUB_SHA::7}
            echo "::group::$img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image \
              --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "$img" || fail=1
            echo "::endgroup::"
          done
          exit $fail

  publish:
    name: package → GHCR + GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [scan]
    runs-on: ubuntu-latest
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: images}
      - run: gunzip -c images.tar.gz | docker load
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - name: tag and push :vX.Y.Z and :sha (the exact images that passed e2e + scan)
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          ver=${GITHUB_REF_NAME}
          for s in $SERVICES; do
            src=fsip/$s:ci-${GITHUB_SHA::7}
            for tag in $ver ${GITHUB_SHA::7}; do
              docker tag $src ghcr.io/$owner/fsip-$s:$tag && docker push ghcr.io/$owner/fsip-$s:$tag
            done
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            docs/evidence/evaluation.md
            docs/evidence/resilience.md
            docs/evidence/observability.md
          body: |
            Images: `ghcr.io/<owner>/fsip-{engine,api,intelligence,frontend}:${{ github.ref_name }}`
            Deploy: `scripts/deploy.sh ${{ github.ref_name }}` (health gate + automatic rollback).
            These exact images passed unit tests, e2e against the official simulator image, the decision-quality gate
            and a Trivy scan (no fixable CRITICAL vulnerabilities).
